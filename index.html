<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מאמן פרומפטים</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="drawer-shell">
    <aside class="drawer" id="drawer">
      <div class="drawer-brand">
        <div class="drawer-icon">🧠</div>
        <div>
          <p class="drawer-title">מאמן פרומפטים</p>
          <p class="drawer-subtitle">ייעוץ · העתקה · למידה</p>
        </div>
      </div>

      <nav class="drawer-nav" aria-label="ניווט ראשי">
        <button type="button" data-tab="dashboard" class="drawer-link active"><span class="icon">🏠</span> דשבורד</button>
        <button type="button" data-tab="trainer" class="drawer-link"><span class="icon">📘</span> מאמן</button>
        <button type="button" data-tab="prompts" class="drawer-link"><span class="icon">💡</span> פרומפטים</button>
        <button type="button" data-tab="plan" class="drawer-link"><span class="icon">🗂️</span> תוכנית</button>
      </nav>
    </aside>

    <div class="content-shell">
      <header class="page-header">
        <button type="button" id="drawer-toggle" class="drawer-toggle" aria-label="פתח תפריט">☰</button>
        <div>
          <p class="eyebrow">יישום פרומפטים</p>
          <h1>מאמן פרומפטים</h1>
        </div>
        <div class="status-chip">ערכת צבע לבנה</div>
      </header>

      <main class="page-main">
        <div class="tabs" role="tablist" aria-label="תפריט תוכן">
          <button type="button" role="tab" data-tab="dashboard" class="tab active">דשבורד</button>
          <button type="button" role="tab" data-tab="trainer" class="tab">מאמן</button>
          <button type="button" role="tab" data-tab="prompts" class="tab">פרומפטים</button>
          <button type="button" role="tab" data-tab="plan" class="tab">תוכנית</button>
        </div>

        <section id="tab-content" class="tab-content"></section>
      </main>
    </div>
  </div>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
